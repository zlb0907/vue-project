name: Pull PMHQ Image Only

on:
  workflow_dispatch:

jobs:
  pull-pmhq:
    runs-on: ubuntu-latest
    steps:
      - name: List available pmhq tags
        run: |
          echo "=== Available pmhq tags ==="
          curl -s "https://hub.docker.com/v2/repositories/linyuchen/pmhq/tags/?page_size=50" \

            | python3 -c "import sys,json; data=json.load(sys.stdin); [print(r['name']) for r in data.get('results',[])]" \
            || echo "Failed to list tags"

      - name: Pull pmhq (try 8.0.6, fallback to latest)
        run: |
          docker pull linyuchen/pmhq:8.0.6 || docker pull linyuchen/pmhq:latest

      - name: Save pmhq to tar
        run: |
          TAG=$(docker images linyuchen/pmhq --format '{{.Tag}}' | head -1)
          echo "Saving pmhq:${TAG}"
          docker save -o pmhq.tar linyuchen/pmhq:${TAG}

      - name: Upload pmhq artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmhq-tar
          path: pmhq.tar
          retention-days: 7
