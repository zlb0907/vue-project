name: Pull PMHQ Image Only

on:
  workflow_dispatch:

jobs:
  pull-pmhq:
    runs-on: ubuntu-latest
    steps:
      - name: List available pmhq tags
        run: |
          echo "=== Available pmhq tags ==="
          curl -s "https://hub.docker.com/v2/repositories/linyuchen/pmhq/tags/?page_size=50" > tags.json
          python3 -c "
          import json
          with open('tags.json') as f:
              data = json.load(f)
          for r in data.get('results', []):
              print(r['name'])
          " || echo "Failed to parse tags"

      - name: Pull pmhq latest
        run: |
          docker pull linyuchen/pmhq:latest

      - name: Save pmhq to tar
        run: |
          echo "Saving linyuchen/pmhq:latest"
          docker save -o pmhq.tar linyuchen/pmhq:latest

      - name: Upload pmhq artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmhq-tar
          path: pmhq.tar
          retention-days: 7
