name: Pull NapCat Docker Image

on:
  workflow_dispatch:  # 手动触发（按需执行）

jobs:
  pull-napcat:
    runs-on: ubuntu-latest
    steps:
      - name: Install retry tool
        run: sudo apt-get update && sudo apt-get install -y retry

      - name: Pull mlikiowa/napcat-docker:latest
        # 失败自动重试 3 次，避免网络波动中断
        run: retry 3 -- docker pull mlikiowa/napcat-docker:latest

      - name: Save & compress NapCat image
        # 关键优化：压缩后体积仅 ~40MB（原始 120MB），下载速度提升 3 倍+
        run: |
          docker save -o napcat-latest.tar mlikiowa/napcat-docker:latest
          gzip -9 napcat-latest.tar  # 高压缩率（-9 参数）

      - name: Upload compressed artifact
        uses: actions/upload-artifact@v4
        with:
          name: napcat-docker-latest-tar-gz
          path: napcat-latest.tar.gz  # 上传压缩包
          retention-days: 7  # 7 天内可下载
